<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chai-Tailwind Login</title>
</head>

<body class="chai-bg-blue chai-min-h-screen chai-flex chai-items-center chai-justify-center chai-p-8">

    <div class="chai-bg-white chai-p-8 chai-w-full chai-max-w-sm chai-border chai-rounded chai-shadow">

        <h1 class="chai-text-2xl chai-font-bold chai-text-gray chai-mb-8 chai-text-center">Welcome</h1>

        <div class="chai-mb-4">
            <label class="chai-block chai-text-sm chai-font-medium chai-text-gray chai-mb-2">Email Address</label>
            <input type="email"
                class="chai-w-full chai-p-3 chai-border chai-border-gray chai-rounded chai-text-base focus:chai-border-blue focus:chai-outline-none"
                placeholder="Enter your email">
        </div>

        <div class="chai-mb-6">
            <label class="chai-block chai-text-sm chai-font-medium chai-text-gray chai-mb-2">Password</label>
            <input type="password"
                class="chai-w-full chai-p-3 chai-border chai-border-gray chai-rounded chai-text-base focus:chai-border-blue focus:chai-outline-none"
                placeholder="Enter your password">
        </div>

        <div class="chai-mb-6">
            <a href="#" class="chai-text-sm chai-text-blue hover:chai-underline">Forgot Password?</a>
        </div>

        <button type="submit"
            class="chai-w-full chai-bg-blue chai-text-white chai-py-3 chai-px-4 chai-rounded chai-text-base chai-font-semibold hover:chai-bg-blue-dark chai-transition">
            Sign In
        </button>

        <p class="chai-text-center chai-mt-6 chai-text-sm chai-text-gray">
            Don't have an account? <a href="#" class="chai-text-blue chai-font-medium hover:chai-underline">Sign up</a>
        </p>
    </div>
    <script src="chai-engine.js"></script>
</body>

</html>
